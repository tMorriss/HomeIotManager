apiVersion: v1
kind: Pod
metadata:
  name: homeiot-pod
spec:
  containers:
    - name: homeiot_web
      image: homeiot:${BUILD_TAG}
      command:
        - python
        - -m
        - homeiot.cli
        - web
      ports:
        - containerPort: 8001
          hostPort: 8930
      env:
        - name: DB_HOST
          value: "${DB_HOST}"
        - name: DB_PORT
          value: "${DB_PORT}"
        - name: DB_USER
          value: "${DB_USER}"
        - name: DB_PASS
          value: "${DB_PASS}"
        - name: DB_NAME
          value: "${DB_NAME}"
        - name: TARGET_PHONE_IPS
          value: "${TARGET_PHONE_IPS}"
        - name: HUE_BRIDGE_IP
          value: "${HUE_BRIDGE_IP}"
        - name: HUE_API_USER
          value: "${HUE_API_USER}"
        - name: HUE_ON_SCENE_ID
          value: "${HUE_ON_SCENE_ID}"
        - name: IFTTT_WEBHOOK_KEY
          value: "${IFTTT_WEBHOOK_KEY}"
        - name: SWITCHBOT_WEBHOOK_TOKEN
          value: "${SWITCHBOT_WEBHOOK_TOKEN}"
    - name: homeiot_worker
      image: homeiot:${BUILD_TAG}
      command:
        - python
        - -m
        - homeiot.cli
        - worker
      env:
        - name: DB_HOST
          value: "${DB_HOST}"
        - name: DB_PORT
          value: "${DB_PORT}"
        - name: DB_USER
          value: "${DB_USER}"
        - name: DB_PASS
          value: "${DB_PASS}"
        - name: DB_NAME
          value: "${DB_NAME}"
        - name: TARGET_PHONE_IPS
          value: "${TARGET_PHONE_IPS}"
        - name: HUE_BRIDGE_IP
          value: "${HUE_BRIDGE_IP}"
        - name: HUE_API_USER
          value: "${HUE_API_USER}"
        - name: HUE_ON_SCENE_ID
          value: "${HUE_ON_SCENE_ID}"
        - name: IFTTT_WEBHOOK_KEY
          value: "${IFTTT_WEBHOOK_KEY}"
        - name: SWITCHBOT_WEBHOOK_TOKEN
          value: "${SWITCHBOT_WEBHOOK_TOKEN}"
