[tox]
envlist = lint, unittest
skipsdist = True

[testenv:lint]
deps =
    -rrequirements/requirements_lint.txt
commands =
    flake8 . --count --show-source --statistics
    python scripts/check_filenames.py

[testenv:unittest]
deps =
    -rrequirements/requirements_test.txt
setenv =
    PYTHONPATH = .
commands =
    coverage run --omit="*/__init__.py" --source=homeiot -m pytest
    coverage report --fail-under=90
    coverage html

[flake8]
max-line-length = 140
inline-quotes = single
multiline-quotes = single
docstring-quotes = single
import-order-style = smarkets
application-import-names = homeiot
exclude =
    .git,
    .tox,
    .venv,
    __pycache__,
    __init__.py
